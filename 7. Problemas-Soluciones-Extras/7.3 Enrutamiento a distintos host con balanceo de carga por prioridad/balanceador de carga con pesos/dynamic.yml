http:
  routers:
      externo-router:
        rule: "PathPrefix(`/externo`)"
        entryPoints:
          - web
        service: externo-weighted
        middlewares:
          - strip-externo
  
    middlewares:
      strip-externo:
        stripPrefix:
          prefixes:
            - "/externo"
  
    services:
      externo-weighted:
        weighted:
          services:
            - name: externo-primary
              weight: 3
            - name: externo-secondary
              weight: 1
  
      externo-primary:
        loadBalancer:
          servers:
            - url: "http://httpbin.org"
  
      externo-secondary:
        loadBalancer:
          servers:
            - url: "https://alsdkfjoei.com"